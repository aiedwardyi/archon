<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archon — Build Apps with AI</title>
    <meta
      name="description"
      content="Go from idea to working app in minutes. Describe what you want, Archon builds it. Every version saved, every change tracked."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%230f172a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2 22 7.5v9L12 22 2 16.5v-9L12 2Z'/><path d='M12 2v20'/><path d='m2 7.5 10 5 10-5'/></svg>"
    />
    <script>
      (() => {
        try {
          const explicitTheme = localStorage.getItem('archon_consumer_theme_preference');
          const theme = explicitTheme === 'dark' || explicitTheme === 'light' ? explicitTheme : 'light';
          document.documentElement.classList.add(theme);
          document.body?.classList?.add(theme);
        } catch {
          document.documentElement.classList.add('light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
